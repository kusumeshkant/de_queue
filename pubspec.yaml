name: dq_app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.1.4
  fluttertoast: ^9.0.0
  dio: ^5.9.0
  shared_preferences: ^2.5.4
  connectivity_plus: ^6.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  get: ^4.7.3
  auto_route: ^10.3.0
  graphql: ^5.2.1
  graphql_flutter: ^5.2.1
  razorpay_flutter: ^1.3.7
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^18.0.1
  geolocator: ^13.0.2



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.10.5
  auto_route_generator: ^10.3.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_logo/DQ_logo_1.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/app_logo/

  # Fonts (example – uncomment when needed)
