<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="DQ — Smart Shopping, Simplified. Scan products, manage your cart, and check out instantly.">
  <meta name="theme-color" content="#0D1B2A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DQ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DQ — Smart Shopping</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0D1B2A;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #dq-loader {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0D1B2A 0%, #1A2D42 50%, #0D1B2A 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 9999;
      transition: opacity 0.45s ease;
    }

    #dq-loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .dq-logo-mark {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(46,134,255,0.25) 0%, rgba(46,134,255,0.08) 100%);
      border: 1px solid rgba(46,134,255,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
    }

    .dq-logo-text {
      font-size: 28px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 3px;
    }

    .dq-tagline {
      font-size: 12px;
      font-weight: 400;
      color: rgba(176, 190, 204, 0.65);
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .dq-bar {
      width: 40px;
      height: 2px;
      background: #2E86FF;
      border-radius: 2px;
      margin-top: 8px;
      animation: dq-pulse 1.4s ease-in-out infinite;
    }

    @keyframes dq-pulse {
      0%, 100% { opacity: 0.3; transform: scaleX(0.7); }
      50%       { opacity: 1;   transform: scaleX(1);   }
    }
  </style>
</head>
<body>
  <div id="dq-loader">
    <div class="dq-logo-mark">
      <span style="font-size:24px;font-weight:800;color:#2E86FF;letter-spacing:1px;">DQ</span>
    </div>
    <div>
      <div class="dq-logo-text" style="text-align:center;">DQ</div>
      <div class="dq-tagline" style="text-align:center;margin-top:4px;">Smart Shopping</div>
    </div>
    <div class="dq-bar"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('dq-loader');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function () { loader.remove(); }, 450);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
